# EXAMPLE instance config — keeps the gates green in CI. The real
# instance lives in the PRIVATE instance repo (values never compiled-in
# by hand; scripts/gen.ts compiles this into src/generated/config.ts).

instance:
  name: Example
  portal_host: cla.example.org
  # The contributor-facing signing instructions; linked from every
  # action-needed comment and check output.
  signing_docs_url: https://github.com/example/cla/blob/main/docs/SIGNING.md
  # The internal roster's managers (issue #62); the roster is a
  # management view and never grants coverage.
  roster_managers:
    - example-manager
  # The separate-agreement registry: STATIC text, seeded once from the
  # census (2026-11-17); membership changes are deliberate PRs. The
  # classification is documentation; the app compiles only the logins
  # and never renders it. Agreements never auto-terminate: removal
  # happens only when Ribose affirmatively ends one.
  separate_agreement:
    staff:
      - example-staff
    contractors:
      - example-contractor
      - falko-strenzke
    # Known commit emails: UNLINKED commits (the git author email does
    # not resolve to a GitHub account) carry no login, so the registry
    # matches the email the commit actually carries.
    emails:
      example-contractor:
        - contractor@example.com
  # The internal roster census: static as well; the view adds live state.
  # A member may also be on the separate-agreement registry — the two lists
  # overlap by design, and the registry is what makes the person covered.
  roster:
    members:
      - login: example-member
        role: staff
        name: Example Member
      - login: example-staff
        role: staff
        name: Example Staff

identity:
  issuer: https://id.example.org
  client_id: example-oidc-client

legal:
  editions:
    # TWO editions, ONE current — the shape a real edition flip deploys
    # (issue #123: 1.1 is drafted while 1.0 stays adopted). A non-current
    # edition is still compiled and its text stays public forever, because
    # a signature binds to the edition it was made against; only `current`
    # makes a signature live.
    icla:
      current: "1.0"
      files:
        "1.0": legal/icla/1.0.md
        "1.1": legal/icla/1.1.md
    ocla:
      current: "1.0"
      files:
        "1.0": legal/ocla/1.0.md
        "1.1": legal/ocla/1.1.md
  # Clause-7 third-party declarations (issue #118): the SPDX ids Ribose
  # accepts. Counsel-owned instance data — the list below is ILLUSTRATIVE
  # for the example instance only. ABSENT = third-party declarations are
  # refused (fail-closed); an explicit empty list = none are accepted.
  third_party:
    accepted_licenses:
      - BSD-2-Clause
      - BSD-3-Clause
      - MIT

github:
  app_slug: example-cla
  data_repo: example-org/cla-data
  offline_repo: example-org/cla-offline
  data_installation_id: 1

coverage:
  # Preapproved logins: covered outright, never asked to sign — the check
  # discloses `covered via allowlist` and the bot stays silent. An org's
  # CI machine account is the canonical case. Only list a `{org}-ci`
  # handle the organization has registered on GitHub: an unregistered
  # name is claimable by anyone, and listing it would preapprove whoever
  # claims it.
  allowlist:
    global:
      - "dependabot[bot]"
      - "github-actions[bot]"
      - "estate-release-manager"  # a non-bot allowlist entry for spec coverage"
    per_org:
      example-org:
        - example-ci
  repos_without_cla: []
  # The proportionality control (issue #58): a PR under BOTH thresholds
  # skips CLA enforcement, visibly. Absent = OFF (the default).
  minimal_change:
    files: 3
    code_lines: 10
  comment_signing:
    automatic: false
  notify:
    digest_threshold: 10
    from: "Ribose CLA <cla@notify.example.org>"

